services:
  # PostgreSQL Database for Auth & Profile Services
  postgres:
    image: postgres:15-alpine
    container_name: ziririt-postgres
    env_file:
      - ./local.env
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../scripts/db/postgres:/docker-entrypoint-initdb.d
    networks:
      - ziririt-network

  # MongoDB Database for Posts & Feed Services
  mongodb:
    image: mongo:7.0
    container_name: ziririt-mongodb
    env_file:
      - ./local.env
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
      - ../../scripts/db/mongodb:/docker-entrypoint-initdb.d
    networks:
      - ziririt-network

  # Redis for Caching & Sessions
  redis:
    image: redis:7.2-alpine
    container_name: ziririt-redis
    command: redis-server --requirepass ziririt_password
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - ziririt-network

  # Auth Service
  ziririt-auth-service:
    build:
      context: ../../
      dockerfile: backend/Dockerfile.local
      args:
        BUILD_CONTEXT: backend/ziririt-auth-service
    container_name: ziririt-auth-service
    ports:
      - '4101:4101'
    env_file:
      - ./local.env
    environment:
      NODE_ENV: development
      PORT: 4101
      SERVICE_NAME: ziririt-auth-service
      GOOGLE_APPLICATION_CREDENTIALS: /base/keys/gcp-dev-key.json
    volumes:
      - ../keys:/base/keys:ro
      - ../../backend/ziririt-auth-service/src:/base/backend/ziririt-auth-service/src
      - ../../packages:/base/packages
    depends_on:
      - postgres
    networks:
      - ziririt-network

  # Profile Service
  ziririt-profile-service:
    build:
      context: ../../
      dockerfile: backend/Dockerfile.local
      args:
        BUILD_CONTEXT: backend/ziririt-profile-service
    container_name: ziririt-profile-service
    env_file:
      - ./local.env
    environment:
      NODE_ENV: development
      PORT: 4102
      SERVICE_NAME: ziririt-profile-service
    ports:
      - '4102:4102'
    volumes:
      - ../../backend/ziririt-profile-service/src:/base/backend/ziririt-profile-service/src
      - ../../packages:/base/packages
    depends_on:
      - postgres
      - ziririt-auth-service
    networks:
      - ziririt-network

  # Post Service
  ziririt-post-service:
    build:
      context: ../../
      dockerfile: backend/Dockerfile.local
      args:
        BUILD_CONTEXT: backend/ziririt-post-service
    container_name: ziririt-post-service
    env_file:
      - ./local.env
    environment:
      NODE_ENV: development
      PORT: 4103
      SERVICE_NAME: ziririt-post-service
    ports:
      - '4103:4103'
    volumes:
      - ../../backend/ziririt-post-service/src:/base/backend/ziririt-post-service/src
      - ../../packages:/base/packages
      - media_storage:/app/media
    depends_on:
      - mongodb
      - ziririt-auth-service
    networks:
      - ziririt-network

  # Feed Service
  ziririt-feed-service:
    build:
      context: ../../
      dockerfile: backend/Dockerfile.local
      args:
        BUILD_CONTEXT: backend/ziririt-feed-service
    container_name: ziririt-feed-service
    env_file:
      - ./local.env
    environment:
      NODE_ENV: development
      PORT: 4104
      SERVICE_NAME: ziririt-feed-service
    ports:
      - '4104:4104'
    volumes:
      - ../../backend/ziririt-feed-service/src:/base/backend/ziririt-feed-service/src
      - ../../packages:/base/packages
    depends_on:
      - mongodb
      - redis
      - ziririt-auth-service
      - ziririt-profile-service
      - ziririt-post-service
    networks:
      - ziririt-network

  # API Gateway Service
  ziririt-api-gateway:
    build:
      context: ../../backend/api-gateway
      dockerfile: Dockerfile.local
    container_name: ziririt-api-gateway
    env_file:
      - ./local.env
    environment:
      NODE_ENV: development
      PORT: 4100
      SERVICE_NAME: ziririt-api-gateway
    ports:
      - '8080:4100'
    volumes:
      - ../../backend/api-gateway/gateway.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - ziririt-auth-service
      - ziririt-profile-service
      - ziririt-post-service
    networks:
      - ziririt-network

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  media_storage:

networks:
  ziririt-network:
    driver: bridge
