services:
  # PostgreSQL Database for Auth & Profile Services
  postgres:
    image: postgres:15-alpine
    container_name: ziririt-postgres
    environment:
      POSTGRES_DB: ziririt_db
      POSTGRES_USER: ziririt_user
      POSTGRES_PASSWORD: ziririt_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../scripts/db/postgres:/docker-entrypoint-initdb.d
    networks:
      - ziririt-network

  # MongoDB Database for Posts & Feed Services
  mongodb:
    image: mongo:7.0
    container_name: ziririt-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ziririt_user
      MONGO_INITDB_ROOT_PASSWORD: ziririt_password
      MONGO_INITDB_DATABASE: ziririt_posts
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ../../scripts/db/mongodb:/docker-entrypoint-initdb.d
    networks:
      - ziririt-network

  # Redis for Caching & Sessions
  redis:
    image: redis:7.2-alpine
    container_name: ziririt-redis
    command: redis-server --requirepass ziririt_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ziririt-network

  # Auth Service
  ziririt-auth-service:
    build:
      context: ../../
      dockerfile: backend/Dockerfile.local
      args:
        BUILD_CONTEXT: backend/ziririt-auth-service
    container_name: ziririt-auth-service
    environment:
      - NODE_ENV=development
      - PORT=4101
      - SERVICE_NAME=ziririt-auth-service
      - DATABASE_URL=postgresql://ziririt_user:ziririt_password@postgres:5432/ziririt_db
      - JWT_SECRET=your-jwt-secret-key-change-in-production
      - JWT_REFRESH_SECRET=your-jwt-refresh-secret-key-change-in-production
      - GOOGLE_CLIENT_ID=your-google-client-id
      - GOOGLE_CLIENT_SECRET=your-google-client-secret
      - APPLE_CLIENT_ID=your-apple-client-id
      - APPLE_PRIVATE_KEY=your-apple-private-key
    ports:
      - "4101:4101"
    volumes:
      - ../../backend/ziririt-auth-service/src:/base/backend/ziririt-auth-service/src
      - ../../packages:/base/packages
    depends_on:
      - postgres
    networks:
      - ziririt-network

  # Profile Service
  ziririt-profile-service:
    build:
      context: ../../
      dockerfile: backend/Dockerfile.local
      args:
        BUILD_CONTEXT: backend/ziririt-profile-service
    container_name: ziririt-profile-service
    environment:
      - NODE_ENV=development
      - PORT=4102
      - SERVICE_NAME=ziririt-profile-service
      - DATABASE_URL=postgresql://ziririt_user:ziririt_password@postgres:5432/ziririt_db
      - AUTH_SERVICE_URL=http://ziririt-auth-service:4101
    ports:
      - "4102:4102"
    volumes:
      - ../../backend/ziririt-profile-service/src:/base/backend/ziririt-profile-service/src
      - ../../packages:/base/packages
    depends_on:
      - postgres
      - ziririt-auth-service
    networks:
      - ziririt-network

  # Post Service
  ziririt-post-service:
    build:
      context: ../../
      dockerfile: backend/Dockerfile.local
      args:
        BUILD_CONTEXT: backend/ziririt-post-service
    container_name: ziririt-post-service
    environment:
      - NODE_ENV=development
      - PORT=4103
      - SERVICE_NAME=ziririt-post-service
      - MONGODB_URI=mongodb://ziririt_user:ziririt_password@mongodb:27017/ziririt_posts?authSource=admin
      - AUTH_SERVICE_URL=http://ziririt-auth-service:4101
      - MEDIA_STORAGE_PATH=/app/media
    ports:
      - "4103:4103"
    volumes:
      - ../../backend/ziririt-post-service/src:/base/backend/ziririt-post-service/src
      - ../../packages:/base/packages
      - media_storage:/app/media
    depends_on:
      - mongodb
      - ziririt-auth-service
    networks:
      - ziririt-network

  # API Gateway Service
  ziririt-api-gateway:
    build:
      context: ../../backend/api-gateway
      dockerfile: Dockerfile.local
    container_name: ziririt-api-gateway
    environment:
      - NODE_ENV=development
      - PORT=8080
      - SERVICE_NAME=ziririt-api-gateway
      - AUTH_SERVICE_URL=http://ziririt-auth-service:4101
      - PROFILE_SERVICE_URL=http://ziririt-profile-service:4102
      - POST_SERVICE_URL=http://ziririt-post-service:4103
      - CORS_ORIGIN=http://localhost:3000,http://localhost:8081
      - RATE_LIMIT=100
    ports:
      - "8080:80"
    volumes:
      - ../../backend/api-gateway/gateway.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - ziririt-auth-service
      - ziririt-profile-service
      - ziririt-post-service
    networks:
      - ziririt-network

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  media_storage:

networks:
  ziririt-network:
    driver: bridge