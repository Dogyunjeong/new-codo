# Ziririt Goal Sharing App - API Gateway Configuration
# Routes requests to microservices

# Upstream service definitions
upstream ziririt-auth-service {
    server ziririt-auth-service:4101;
}

upstream ziririt-profile-service {
    server ziririt-profile-service:4102;
}

upstream ziririt-post-service {
    server ziririt-post-service:4103;
}

# Feed service not implemented yet
# upstream ziririt-feed-service {
#     server ziririt-feed-service:4104;
# }

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    # Enable CORS for development
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization" always;
    
    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Gateway health check
    location /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"healthy","service":"ziririt-api-gateway","timestamp":"$time_iso8601"}\n';
    }

    # Auth service routes
    location /auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://ziririt-auth-service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Profile service routes  
    location /profiles/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://ziririt-profile-service/profiles/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Social service routes (handled by profile service)
    location /social/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://ziririt-profile-service/social/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Post service routes
    location /posts/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://ziririt-post-service/posts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Media service routes (handled by post service)
    location /media/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://ziririt-post-service/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Feed service routes
    location /feed/ {
        limit_req zone=api burst=20 nodelay;
        # Feed service not implemented yet
        return 503 "Feed service not available";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Default route - API information
    location = / {
        return 200 '{"service":"ziririt-api-gateway","version":"1.0.0","endpoints":{"/health":"Gateway health","/auth":"Auth service","/profiles":"Profile service","/social":"Social service","/posts":"Post service","/media":"Media service","/feed":"Feed service"}}\n';
        add_header Content-Type application/json;
    }

    # 404 handler
    location / {
        return 404 '{"error":"Not Found","message":"Route not found","timestamp":"$time_iso8601"}\n';
        add_header Content-Type application/json;
    }
}